<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Anmeldung bestätigen — M. von Wedelstaedt</title>
<link rel="icon" type="image/png" href="/favicon-32.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap');

  :root {
    --bg: #FAF6EE; --surface: #FFFFFF; --surface-2: #EFE7D6;
    --ink: #22333B; --ink-soft: #5B6B72; --gold: #A97C3F; --gold-bright: #C9A66B;
    --rule: rgba(34, 51, 59, 0.16); --shadow: 0 18px 40px -22px rgba(34, 51, 59, 0.35);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12191D; --surface: #1C262B; --surface-2: #202B31;
      --ink: #EDE6D6; --ink-soft: #A9B7BC; --gold: #D8B67E; --gold-bright: #D8B67E;
      --rule: rgba(237, 230, 214, 0.14); --shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.6);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Source Serif 4", Georgia, "Times New Roman", serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--gold); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1 { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; text-wrap: balance;
    font-size: clamp(2rem, 5vw, 2.75rem); line-height: 1.2; margin: 1rem 0 0.75rem; }
  .eyebrow { font-size: 0.78rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin: 0 0 18px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 56px 24px 96px; text-align: center; }
  .logo { width: 96px; height: 96px; border-radius: 50%; display: block; margin: 0 auto 28px;
    box-shadow: 0 0 0 1px var(--rule), 0 16px 32px -18px rgba(0,0,0,0.45); }
  .sub { font-size: 1.0625rem; color: var(--ink-soft); line-height: 1.65; margin: 0 0 2rem; }
  .btn { display: inline-block; padding: 15px 30px; background: var(--ink); color: var(--bg);
    font-family: "Source Serif 4", serif; font-size: 1rem; font-weight: 700; border: none;
    border-radius: 10px; cursor: pointer; text-decoration: none; transition: opacity 150ms; }
  .btn:hover { opacity: 0.88; text-decoration: none; }
  .btn:disabled { opacity: 0.6; cursor: wait; }
  .btn.zweit { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); margin-top: 14px; }
  .fehler { color: #c84444; margin-top: 16px; font-size: 0.95rem; }
  footer { text-align: center; padding: 0 24px 48px; font-size: 0.8rem; color: var(--ink-soft); }
  footer a { color: var(--ink-soft); text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <a href="/"><img class="logo" src="/mvw-logo.png" alt="M. von Wedelstaedt" width="96" height="96"></a>
  <p class="eyebrow" id="eyebrow">Fast geschafft</p>
  <h1 id="h1">Anmeldung bestätigen</h1>
  <p class="sub" id="sub">Ein Klick noch, dann schicken wir dir deine 5 Bonus-Ausmalbilder.</p>
  <button class="btn" id="knopf" type="button">Ja, ich möchte mich anmelden</button>
  <div id="danach" hidden>
    <a class="btn zweit" id="serie" href="/">Alle Bücher der Serie ansehen</a>
  </div>
  <p class="fehler" id="fehler" hidden></p>
</div>
<footer><a href="/impressum">Impressum</a> &middot; <a href="/datenschutz">Datenschutz</a></footer>

<script>
  const WEBHOOK_URL = 'https://n8n.srv1082810.hstgr.cloud/webhook/kinderbuecher-bonus-confirm';
  const p = new URLSearchParams(window.location.search);
  const sprache = p.get('lang') === 'en' ? 'en' : 'de';
  const email = p.get('e') || '';
  const token = p.get('t') || '';

  const T = {
    de: {
      title: 'Anmeldung bestätigen — M. von Wedelstaedt', eyebrow: 'Fast geschafft', h1: 'Anmeldung bestätigen',
      sub: 'Ein Klick noch, dann schicken wir dir deine 5 Bonus-Ausmalbilder.',
      knopf: 'Ja, ich möchte mich anmelden', sende: 'Einen Moment …',
      okEyebrow: 'Bestätigt', okH1: 'Danke, das hat geklappt!',
      okSub: 'Dein PDF ist unterwegs und liegt in wenigen Augenblicken in deinem Postfach. Schau bitte auch im Spam-Ordner nach.',
      serie: 'Alle Bücher der Serie ansehen',
      fehlerLink: 'Dieser Link ist ungültig oder abgelaufen. Trage deine E-Mail-Adresse bitte noch einmal auf der Seite zum Buch ein.',
      fehlerNetz: 'Das hat leider nicht geklappt. Bitte versuche es in ein paar Minuten noch einmal.',
    },
    en: {
      title: 'Confirm your sign-up — M. von Wedelstaedt', eyebrow: 'Almost done', h1: 'Confirm your sign-up',
      sub: 'One more click and we will send you your 5 bonus coloring pages.',
      knopf: 'Yes, sign me up', sende: 'One moment …',
      okEyebrow: 'Confirmed', okH1: 'Thank you, it worked!',
      okSub: 'Your PDF is on its way and will be in your inbox in a few moments. Please check your spam folder too.',
      serie: 'See all books in the series',
      fehlerLink: 'This link is invalid or has expired. Please enter your email address again on the page from your book.',
      fehlerNetz: 'Something went wrong. Please try again in a few minutes.',
    },
  }[sprache];

  document.documentElement.lang = sprache;
  document.title = T.title;
  document.getElementById('eyebrow').textContent = T.eyebrow;
  document.getElementById('h1').textContent = T.h1;
  document.getElementById('sub').textContent = T.sub;
  document.getElementById('serie').textContent = T.serie;
  document.getElementById('serie').href = '/?lang=' + sprache;
  const knopf = document.getElementById('knopf');
  const fehler = document.getElementById('fehler');
  knopf.textContent = T.knopf;

  if (!email || token.length < 32) {
    knopf.hidden = true;
    fehler.textContent = T.fehlerLink;
    fehler.hidden = false;
  }

  knopf.addEventListener('click', async () => {
    knopf.disabled = true;
    knopf.textContent = T.sende;
    fehler.hidden = true;
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, token }),
      });
      if (res.status === 400) throw new Error('link');
      if (!res.ok) throw new Error('netz');
      document.getElementById('eyebrow').textContent = T.okEyebrow;
      document.getElementById('h1').textContent = T.okH1;
      document.getElementById('sub').textContent = T.okSub;
      knopf.hidden = true;
      document.getElementById('danach').hidden = false;
    } catch (err) {
      fehler.textContent = err.message === 'link' ? T.fehlerLink : T.fehlerNetz;
      fehler.hidden = false;
      knopf.disabled = false;
      knopf.textContent = T.knopf;
    }
  });
</script>
</body>
</html>
